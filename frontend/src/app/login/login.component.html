<div class="login-container">
  <div class="login-box">
    <h2>Admin Login</h2>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="input-control" [(ngModel)]="credentials.username" name="username" required>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="input-control" [(ngModel)]="credentials.password" name="password" required>
      </div>
      
      <button type="submit" class="btn login-btn" [disabled]="!loginForm.valid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
